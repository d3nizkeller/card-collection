# server/worker/wrangler.toml — конфигурация Cloudflare Worker (b463)
#
# Что сделать один раз перед деплоем (подробно в server/README.md):
#   1. npx wrangler login
#   2. npx wrangler d1 create nexus-bank      → скопировать database_id сюда
#   3. npx wrangler secret put NX_SECRET      → любая длинная случайная строка
#   4. npx wrangler deploy
#
# ВАЖНО: NX_SECRET и database_id — это секреты/настройки развёртывания.
# В репозитории их быть не должно (database_id не секретен, но у каждого
# свой; NX_SECRET задаётся только через wrangler secret).

name = "nexus-card-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Совместимость с Node-подобным поведением (не обязательна, но полезна для crypto)
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"                 # имя, по которому база доступна в коде (env.DB)
database_name = "nexus-bank"
database_id = "ЗАПОЛНИТЬ_ПОСЛЕ_wrangler_d1_create"

# Почасовая чистка ключей операций (идемпотентность)
[triggers]
crons = ["0 * * * *"]

[vars]
# Комната по умолчанию, если клиент не прислал свою ('site' = общий банк сайта)
NX_ROOM = "site"
# Разрешённые источники CORS через запятую. GitHub Pages уже в списке по умолчанию
# (см. src/index.js: DEFAULT_ORIGINS), сюда добавляем свой домен, если он будет.
NX_ORIGINS = ""
# Ключ первой регистрации учётки Студии: если задан, создать логин/пароль можно
# только с ним. Рекомендуется задать, чтобы никто не успел занять Студию первым.
# Задаётся секретом: npx wrangler secret put NX_SETUP_KEY
# NX_SETUP_KEY = ""

[observability]
enabled = true

# Локальная разработка без Cloudflare — server/dev/serve.mjs (тот же код на node):
#   node server/dev/serve.mjs   → http://127.0.0.1:8787
# Локальный запуск настоящего воркера:
#   cd server/worker && npx wrangler dev
